<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   
    <div class="dashboard">
        <header class="head">
            <h2>My Dashboard</h2>
        </header>
        <aside class="side">
            <h3>Menu</h3>
            <p>Home</p>
            <p>Profile</p>
            <p>Settings</p>
        </aside>
        <main class="main">
            <h2>Welcome</h2>
            <p>This is the main dashboard area.</p>
        </main>
        <main class="main">
            <h2>Dashboard Overveiw</h2>

            <div class="box-container">

                <div class="box">
                    <span class="icon">👤</span>
                    <div>
                        <h3>Users</h3>
                        <p>120 Students</p>
                    </div>
                </div>
                <div class="box">
                    <span class="icon">📚</span>
                    <div>
                    <h3>Courses</h3>
                    <p>8 Courses</p>
                    </div>
                </div>
                <div class="box">
                    <span class="icon">📑</span>
                    <div>
                        <h3>Assignments</h3>
                        <p>15 Assignments</p>
                    </div>
                </div>
                <div class="box">
                    <span class="icon">⭐</span>
                    <div>
                        <h3>Performance</h3>
                        <p>Good Progress</p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="foot">
            <p>Dashboard Footer</p>
        </footer>

    </div>
</body>
</html>
