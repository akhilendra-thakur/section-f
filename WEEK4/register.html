<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club Registration</title>
</head>
<body>
    <h1>TECH CLUB</h1>
    <nav>
       <a href="index.html">Home</a>
       <a href="about.html">About</a>
       <a href="register.html">Register</a>
       <a href="contact.html">Contact Us</a>
    </nav>
    <hr> 
    <h2>Student Registration Form</h2>
    <form>
       <label for="name">Name:</label>
       <input type="name" id="name" name="name" required> 
       <br><br>
       <label for="email">Email:</label>
       <input type="email" id="email" name="email" required>
       <br><br>
       <label for="password">Password:</label>
       <input type="password" id="password" name="password" required>
       <br><br>
      
       <label for="dob">Date of Birth:</label>
<input type="date" id="dob" name="dob">
<br><br>

<label for="phone">Phone:</label>
<input type="tel" id="phone" name="phone">
<br><br>

<p>Year:</p>
<input type="radio" id="first" name="year" value="First">
<label for="first">First Year</label>

<input type="radio" id="second" name="year" value="Second">
<label for="second">Second Year</label>
<br><br>

<p>Interests:</p>
<input type="checkbox" id="coding" name="interest" value="Coding">
<label for="coding">Coding</label>

<input type="checkbox" id="robotics" name="interest" value="Robotics">
<label for="robotics">Robotics</label>
<br><br>

<label for="event">Choose Event:</label>
<select id="event" name="event">
    <option value="hackathon">Hackathon</option>
    <option value="webdesign">Web Design</option>
    <option value="robotics">Robotics Workshop</option>
</select>
<br><br>

<label for="message">Message:</label>
<br>
<textarea id="message" name="message" rows="4" cols="30"></textarea>
<br><br>
 <button type="submit">Register</button>
<br><br>
    </form>
</body>
</html>
