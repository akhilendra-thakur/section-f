
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akhilendra's Projects</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      padding: 24px;
    }
    h1 { text-align: center; }
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      max-width: 1000px;
      margin: 30px auto;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <h1>Akhilendra Thakur Projects Dashboard</h1>
  <p style="text-align:center">All my assignment projects in one place</p>
  <div class="projects" id="projects"></div>

  <script>
    const weeks = [2, 3, 4, 5, 6, 7, 8];

    document.getElementById("projects").innerHTML =
      weeks.map(week => `
        <div class="card">
          <h2>WEEK ${week}</h2>
          <p>HTML & CSS Project</p>
          <a href="WEEK${week}/">Open Project ↗</a><br><br>
          <a href="https://github.com/akhilendra-thakur/section-f/tree/main/WEEK${week}">
            View Source Code
          </a>
        </div>
      `).join("");
  </script>
</body>
</html>
